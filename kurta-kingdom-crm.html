/* ============ WEBHOOKS & LOGS ============ */
function wbSamples(){
  const post=DB.posts[0],fbp=DB.posts.find(p=>p.platform==='facebook')||DB.posts[0],cfg=DB.config;
  const o=DB.orders.find(x=>x.status==='processing'&&x.phone)||DB.orders.find(x=>x.phone),c=custByPhone(o.phone);
  return {
    meta_verify:{'hub.mode':'subscribe','hub.verify_token':cfg.verify_token,'hub.challenge':'1158201444'},
    ig_comment:{object:'instagram',entry:[{id:cfg.ig_account_id,time:Math.floor(Date.now()/1000),changes:[{field:'comments',value:{id:'179'+rnd(1e13,9e13),text:'Price?',from:{id:String(rnd(1e15,9e15)),username:'sana.shaikh'},media:{id:post.id,media_product_type:'FEED'}}}]}]},
    fb_comment:{object:'page',entry:[{id:cfg.fb_page_id,time:Math.floor(Date.now()/1000),changes:[{field:'feed',value:{item:'comment',verb:'add',comment_id:fbp.id.split('_')[0]+'_'+rnd(1e10,9e10),post_id:fbp.id,message:'kitna hai link bhejo',from:{id:String(rnd(1e15,9e15)),name:'Kriti Sinha'}}}]}]},
    wa_inbound:{object:'whatsapp_business_account',entry:[{changes:[{field:'messages',value:{metadata:{phone_number_id:cfg.phone_number_id},contacts:[{profile:{name:c.name}}],messages:[{from:c.phone,id:'wamid.'+rnd(1e6,9e6),type:'text',text:{body:'TRACK '+o.id}}]}}]}]},
    order_status:{status:'shipped',phone:o.phone,customerName:o.name,orderId:o.id,itemTitle:o.items[0].title,courier:'Delhivery',awb:'DLV'+rnd(1e7,9e7),trackingUrl:'https://www.delhivery.com/track/package/DLV12345678',eta:'20 Oct tak',deliveredAt:fmtDay(Date.now())}
  };
}
const WB_EP={meta_verify:'GET /meta-social-commerce',ig_comment:'POST /meta-social-commerce',fb_comment:'POST /meta-social-commerce',wa_inbound:'WhatsApp Message Trigger',order_status:'POST /order-status-update'};
const WB_PILL={meta_verify:'b-info',meta_comment:'b-pur',wa_inbound:'b-ok',order_status:'b-warn'};
function waCloudPost(body){
  const out=[];for(const e of body.entry||[])for(const ch of e.changes||[]){const v=ch.value||{};const m=v.messages&&v.messages[0];if(!m)continue;
    let text='';if(m.type==='text')text=(m.text&&m.text.body)||'';else if(m.type==='button')text=(m.button&&(m.button.text||m.button.payload))||'';else if(m.type==='interactive'&&m.interactive){const r=m.interactive.button_reply||m.interactive.list_reply||{};text=r.id||r.title||'';}
    const nm=(v.contacts&&v.contacts[0]&&v.contacts[0].profile&&v.contacts[0].profile.name)||'there';waInbound(String(m.from),nm,text);out.push(`message ${m.id} from ${m.from} → intent ${parseWA(text).intent}`);}
  return {status:200,json:{ok:true,routed:out}};
}
VIEWS.webhooks={title:'Webhooks & Logs',render(){
  const t=UI.wbType,s=wbSamples();UI._wbBody=JSON.stringify(s[t],null,2);
  return `<div class="page-h"><h2>Webhooks &amp; event log</h2><span class="muted sm-t">Fire the same calls Meta, WhatsApp and your store send to n8n</span></div>
  <div class="grid g2" style="align-items:start"><div class="card"><div class="hd">Request</div><div class="bd col"><label class="f">Endpoint<select data-ch="wbType">${[['meta_verify','GET — Meta webhook verification'],['ig_comment','POST — Instagram comment event'],['fb_comment','POST — Facebook page comment event'],['wa_inbound','POST — WhatsApp inbound message'],['order_status','POST — /order-status-update (Shopify / courier)']].map(([k,l])=>`<option value="${k}" ${t===k?'selected':''}>${l}</option>`).join('')}</select></label>
   <div class="row"><span class="pill">${t==='meta_verify'?'GET':'POST'}</span><span class="mono">${esc(DB.config.base_url||'https://n8n.example.com')}/webhook/${esc(WB_EP[t].replace(/^(GET|POST) \//,'').replace('WhatsApp Message Trigger','whatsapp'))}</span></div>
   <label class="f">${t==='meta_verify'?'Query parameters':'JSON body'}<textarea id="wbBody" rows="15" class="mono" spellcheck="false">${esc(UI._wbBody)}</textarea></label><div class="row"><button class="btn pri" data-act="wbSend">${icon('send','sm')} Send</button><span class="muted xs-t">${t==='meta_verify'?'Change the token to see the 403.':t==='ig_comment'||t==='fb_comment'?'Comment with a keyword like “price” to get a DM.':''}</span></div></div></div>
  <div class="col"><div class="card"><div class="hd">Response <span class="sp"></span><span id="wbStatus"></span></div><div class="bd"><pre class="json" id="wbResp">Send a request to see the response…</pre></div></div><div class="card"><div class="hd">Verify-token rule</div><div class="bd sm-t muted">Meta calls <b>GET</b> with <span class="mono">hub.verify_token</span>; if it equals <span class="mono">${esc(DB.config.verify_token)}</span> the challenge is echoed (200), otherwise <b>403 Forbidden</b>.</div></div></div></div>
  <div class="card" style="margin-top:14px"><div class="hd">Event log <span class="sub">last ${DB.webhooks.length}</span></div><div id="wbLog"></div></div>`;
},mount(){this.update();},update(){
  const l=$('#wbLog');if(!l)return;
  l.innerHTML=`<div class="tbl-wrap"><table class="t"><thead><tr><th>Time</th><th>Type</th><th>Status</th><th>Summary</th><th></th></tr></thead><tbody>${DB.webhooks.slice(0,30).map(w=>`<tr><td class="muted" style="white-space:nowrap">${fmtShort(w.at)}</td><td><span class="badge ${WB_PILL[w.type]||''}">${w.type}</span></td><td><span class="pill ${w.status===200?'ok':'bad'}">${w.status}</span></td><td class="sm-t">${esc(w.summary)}</td><td>${w.payload?`<button class="btn sm ghost" data-act="wbView" data-id="${w.id}">View</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No events yet</td></tr>'}</tbody></table></div>`;
}};
INP.wbType=el=>{UI.wbType=el.value;render();};
ACT.wbSend=()=>{
  let body;try{body=JSON.parse($('#wbBody').value||'{}');}catch(e){toast('Invalid JSON: '+e.message,'err');return;}
  let r;const t=UI.wbType;
  if(t==='meta_verify')r=metaVerify(body);
  else if(t==='ig_comment'||t==='fb_comment')r=metaPost(body);
  else if(t==='wa_inbound'){r=waCloudPost(body);logWebhook('wa_inbound',200,'WhatsApp Cloud API payload received',body,r.json);}
  else{r=orderStatusWebhook(body);const w=DB.webhooks[0];if(w&&w.type==='order_status'){w.payload=body;w.response=r.json;}}
  $('#wbResp').textContent=r.text!=null?r.text:JSON.stringify(r.json,null,2);
  $('#wbStatus').innerHTML=`<span class="pill ${r.status===200?'ok':'bad'}">HTTP ${r.status}</span>`;
  VIEWS.webhooks.update();
};
ACT.wbView=el=>{const w=DB.webhooks.find(x=>x.id===el.dataset.id);openModal({title:`${w.type} · ${fmtShort(w.at)}`,wide:true,body:`<div class="b sm-t">Payload</div><pre class="json">${esc(JSON.stringify(w.payload,null,2))}</pre><div class="b sm-t" style="margin-top:10px">Response</div><pre class="json">${esc(typeof w.response==='string'?w.response:JSON.stringify(w.response,null,2))}</pre>`,actions:[{label:'Close',onClick:closeModal}]});};

/* ============ SETTINGS ============ */

  return `<div class="page-h"><h2>Settings</h2><span class="muted sm-t">Mirrors the “Store Config” node and webhook settings</span></div>
  <div class="grid g2" style="align-items:start"><div class="col">
   <div class="card" id="sec-store"><div class="hd">Store config <span class="sub">Store Config node</span></div><div class="bd col">
    <div class="grid g2"><label class="f">Brand name<input name="brand_name" type="text" value="${esc(c.brand_name)}"></label><label class="f">Shopify domain<input name="shop_domain" type="text" value="${esc(c.shop_domain)}"></label></div>
    <div class="grid g2"><label class="f">WhatsApp number (wa.me)<input name="wa_number" type="text" value="${esc(c.wa_number)}"></label><label class="f">UTM campaign<input name="utm_campaign" type="text" value="${esc(c.utm_campaign)}"></label></div>

    <div class="grid g3"><label class="f">Support opens (hour)<input name="support_start" type="number" min="0" max="23" value="${c.support_start}"></label><label class="f">Support closes (hour)<input name="support_end" type="number" min="1" max="24" value="${c.support_end}"></label><label class="f">SLA (hours)<input name="sla_hours" type="number" min="1" value="${c.sla_hours}"></label></div>

    <div><button class="btn pri" data-act="saveSec" data-sec="support">Save</button></div></div></div>
  </div><div class="col">
   <div class="card" id="sec-meta"><div class="hd">Meta &amp; WhatsApp <span class="sub">mock values</span></div><div class="bd col">
    <label class="f">Webhook verify token<input name="verify_token" type="text" value="${esc(c.verify_token)}"></label>
    <div class="grid g2"><label class="f">Instagram account ID<input name="ig_account_id" type="text" value="${esc(c.ig_account_id)}"></label><label class="f">Facebook page ID<input name="fb_page_id" type="text" value="${esc(c.fb_page_id)}"></label></div>
    <label class="f">WhatsApp phone number ID<input name="phone_number_id" type="text" value="${esc(c.phone_number_id)}"></label>
    <div><button class="btn pri" data-act="saveSec" data-sec="meta">Save</button></div></div></div>
   <div class="card"><div class="hd">Demo controls</div><div class="bd col"><label class="f">Random carousel failure rate (shows the text-DM fallback)<select data-ch="failRate">${[0,0.1,0.25,0.5,1].map(v=>`<option value="${v}" ${DB.settings.fail_rate===v?'selected':''}>${Math.round(v*100)}%</option>`).join('')}</select></label>
    <div class="sm-t muted">Everything is stored in this browser (localStorage).</div><div class="row wrap"><button class="btn" data-act="exportDb">${icon('download','sm')} Export JSON</button><button class="btn" data-act="importDb">${icon('upload','sm')} Import JSON</button><input type="file" id="importFile" accept="application/json" class="hide" data-ch="importFile"><span class="sp"></span><button class="btn dng" data-act="resetDb">${icon('refresh','sm')} Reset demo data</button><button class="btn dng" data-act="clearDb">${icon('trash','sm')} Clear all</button></div></div></div>
  </div></div>`;
}};
INP.failRate=el=>{DB.settings.fail_rate=+el.value;save();toast('Failure rate '+Math.round(+el.value*100)+'%');};
ACT.saveSec=el=>{const f=formData($('#sec-'+el.dataset.sec)),c=DB.config,s=el.dataset.sec;
  if(s==='store')Object.assign(c,{brand_name:f.brand_name,shop_domain:f.shop_domain.trim(),wa_number:digits(f.wa_number),utm_campaign:f.utm_campaign,use_mock:f.use_mock});
  if(s==='support'){if(+f.support_end<=+f.support_start){toast('Closing hour must be after opening hour','err');return;}Object.assign(c,{support_start:+f.support_start,support_end:+f.support_end,sla_hours:+f.sla_hours||2,capture_details:f.capture_details});}
  if(s==='meta')Object.assign(c,{verify_token:f.verify_token.trim(),ig_account_id:f.ig_account_id.trim(),fb_page_id:f.fb_page_id.trim(),phone_number_id:f.phone_number_id.trim()});
  save();toast('Settings saved','ok');};
ACT.exportDb=()=>{jsonDownload('kurta-kingdom-crm-backup.json',DB);toast('Backup downloaded','ok');};
ACT.importDb=()=>$('#importFile').click();
INP.importFile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.orders||!d.config||!d.products)throw new Error('Not a Kurta Kingdom backup');DB=d;save();render();toast('Backup imported','ok');}catch(e){toast('Import failed: '+e.message,'err');}};r.readAsText(f);};
ACT.resetDb=()=>confirmBox('Reset to the original demo data? Your changes will be lost.',()=>{DB=seedData();UI.chat=null;UI.cmtSel=null;save();render();toast('Demo data restored','ok');},'Reset');
ACT.clearDb=()=>confirmBox('Delete all comments, customers, orders, tickets and chats? Catalog, posts and settings stay.',()=>{Object.assign(DB,{comments:[],customers:[],messages:[],orders:[],tickets:[],webhooks:[],events:[]});UI.chat=null;UI.cmtSel=null;save();render();toast('Records cleared');},'Clear all');

/* ============ BOOT ============ */
(function boot(){
  try{const th=localStorage.getItem('kk_theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
  load();
  ['products','posts','comments','customers','messages','orders','tickets','templates','webhooks','events'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  DB.settings=Object.assign({fail_rate:0.1},DB.settings||{});
  const dark=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
  $('#themeBtn').innerHTML=icon(dark?'sun':'moon');
  const h=location.hash.slice(1);UI.tab=VIEWS[h]?h:'dashboard';
  render();
  setInterval(()=>{if(!document.hidden&&!MODAL)refresh();},30000);
  window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VIEWS[t]&&t!==UI.tab){UI.tab=t;render();}});
  window.__crm={get db(){return DB;},ui:UI,go};
})();

</script>
