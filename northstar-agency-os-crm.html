<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Agency OS</title>
<meta name="description" content="Agency CRM for clients, onboarding, content approvals, lead scoring, campaign KPIs and client reports. Demo with mock data.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-strong:#CBD5E1;
  --text:#0F172A;--text-2:#334155;--muted:#475569;--faint:#64748B;
  --primary:#2563EB;--primary-d:#1D4ED8;--primary-soft:#EFF6FF;--primary-ring:rgba(37,99,235,.35);
  --accent:#059669;--accent-soft:#ECFDF5;--accent-d:#047857;
  --warn:#B45309;--warn-soft:#FEF3C7;--danger:#B91C1C;--danger-soft:#FEE2E2;--violet:#6D28D9;--violet-soft:#EDE9FE;--slate-soft:#E2E8F0;
  --c1:#2563EB;--c2:#0D9488;--c3:#D97706;--c4:#7C3AED;--c5:#64748B;--c6:#DC2626;
  --radius:10px;--radius-sm:7px;--shadow:0 1px 2px rgba(15,23,42,.05);--shadow-md:0 4px 14px rgba(15,23,42,.08);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --font:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;z-index:300;text-decoration:none;font-weight:600}.skip:focus{top:8px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.i.sm{width:14px;height:14px}.i.lg{width:22px;height:22px}
.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.faint{color:var(--faint)}.xs{font-size:12px}.sm{font-size:13px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:var(--sp-2)}.row.wrap{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:var(--sp-3)}.hide{display:none!important}
.grid{display:grid;gap:var(--sp-4)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g31{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g13{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand b{display:block;font-size:15px;line-height:1.15}.brand small{color:var(--muted);font-size:12px}
nav.nav{padding:6px 10px;overflow:auto;flex:1}
.nav-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--text-2);cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s}
.nav-i:hover{background:var(--surface-2);color:var(--text)}
.nav-i[aria-current=page]{background:var(--primary-soft);color:var(--primary-d);font-weight:600}
.nav-i .cnt{margin-left:auto;background:var(--slate-soft);color:var(--text-2);border-radius:99px;font-size:12px;padding:0 8px;font-weight:600;min-width:22px;text-align:center}
.nav-i .cnt.alert{background:var(--danger-soft);color:var(--danger)}
.side-foot{padding:12px 16px;border-top:1px solid var(--border)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.top h1{font-size:18px;white-space:nowrap}
.search{position:relative;flex:1;max-width:420px;margin-left:12px}
.search input[type=search]{width:100%;min-height:38px;padding:7px 12px 7px 36px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)}
.search .i{position:absolute;left:11px;top:10px;color:var(--faint)}
.gs{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);max-height:340px;overflow:auto;z-index:60}
.gs button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px}.gs button:hover{background:var(--surface-2)}
#view{padding:24px 28px 56px;flex:1;min-width:0;max-width:1480px;width:100%}
.menu-btn{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;color:var(--text);transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-d)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ok:hover{background:var(--accent-d)}
.btn.dng{color:var(--danger);border-color:#FCA5A5}.btn.dng:hover{background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--text-2)}.icon-btn:hover{background:var(--surface-2)}
.icon-btn.flat{border-color:transparent;background:transparent}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=search],input[type=date],input[type=url],input[type=month],select,textarea{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
textarea{resize:vertical;min-height:80px}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--text-2)}
.fld .hint{font-weight:400;color:var(--muted);font-size:12px}.fld .err{font-weight:500;color:var(--danger);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:28px}.chk input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:16px 18px 0;font-weight:600;font-size:15px}
.card>.hd .sub{font-weight:400;color:var(--muted);font-size:13px}
.card>.bd{padding:14px 18px 18px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.page-h h2{font-size:22px}.page-h .desc{color:var(--muted);flex:1 1 220px;min-width:0}.page-h .sp{display:none}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}.kpi .s{font-size:13px;color:var(--muted)}
.kpi.clk{cursor:pointer;transition:border-color .15s,box-shadow .15s}.kpi.clk:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.delta{font-weight:600}.delta.up{color:var(--accent-d)}.delta.down{color:var(--danger)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--slate-soft);color:var(--text-2)}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot:before{display:none}
.b-ok{background:var(--accent-soft);color:var(--accent-d)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--danger-soft);color:var(--danger)}.b-info{background:var(--primary-soft);color:var(--primary-d)}.b-vio{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);margin:0 4px 4px 0}
.chip.tag{background:var(--primary-soft);color:var(--primary-d);border-color:#BFDBFE}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}.av.sm{width:26px;height:26px;font-size:11px}.av.lg{width:44px;height:44px;font-size:15px}
.av.sq{border-radius:9px}
/* table */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);font-weight:600}
table.t th.sortable{cursor:pointer}table.t th.sortable:hover{color:var(--text)}
table.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.clk{cursor:pointer}table.t tbody tr.clk:hover{background:var(--surface-2)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;flex-wrap:wrap;border:1px solid var(--border)}
.tabs button{border:0;background:none;padding:6px 12px;min-height:32px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.tabs .n{font-size:12px;color:var(--faint);margin-left:4px}
.progress{height:8px;border-radius:99px;background:var(--slate-soft);overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}.progress.ok>i{background:var(--accent)}
.hbar{display:grid;grid-template-columns:128px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.dt{margin-top:8px;font-size:13px}details.dt summary{cursor:pointer;color:var(--primary-d);font-weight:500}
.list-i{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.list-i:last-child{border:0}
.feed>div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.feed>div:last-child{border:0}
.feed .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-d);flex:none}
.scroll-y{max-height:360px;overflow:auto}
pre.json{margin:0;background:#0F172A;color:#E2E8F0;border-radius:var(--radius-sm);padding:14px;overflow:auto;font-family:var(--mono);font-size:12px;max-height:380px;white-space:pre-wrap;word-break:break-word}
.notice{padding:10px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start;border:1px solid transparent}
.notice.info{background:var(--primary-soft);color:var(--primary-d);border-color:#BFDBFE}.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:#FDE68A}.notice.ok{background:var(--accent-soft);color:var(--accent-d);border-color:#A7F3D0}.notice.bad{background:var(--danger-soft);color:var(--danger);border-color:#FECACA}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.ov.drawer{justify-content:flex-end;padding:0}
.md{background:var(--surface);border-radius:14px;width:min(600px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,23,42,.3)}
.md.wide{width:min(920px,100%)}
.ov.drawer .md{border-radius:0;height:100vh;max-height:100vh;width:min(580px,100%)}
.md>.mh{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:17px}
.md>.mb{padding:18px 20px;overflow:auto;flex:1}
.md>.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
#toasts{position:fixed;top:68px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;width:max-content;max-width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-md);font-size:14px;display:flex;gap:8px;align-items:flex-start;animation:fadein .2s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--accent-d)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
/* domain-specific */
.kcols{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-width:240px}
.kcol>.kh{padding:12px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.kcol>.kb{padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;min-height:70px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px;box-shadow:var(--shadow)}
.post-prev{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.post-prev .ph{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.post-prev .pi{aspect-ratio:16/9;background:linear-gradient(135deg,#DBEAFE,#E0F2FE);display:grid;place-items:center;color:var(--primary-d)}
.post-prev .pb{padding:12px;white-space:pre-wrap}
.accordion{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.accordion details{border-bottom:1px solid var(--border)}.accordion details:last-child{border:0}
.accordion summary{padding:12px 16px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;min-height:44px}
.accordion .ab{padding:0 16px 14px}
.trace{display:flex;flex-direction:column}
.trace>div{display:flex;gap:10px;padding:6px 0;position:relative}
.trace>div:before{content:"";position:absolute;left:9px;top:26px;bottom:-6px;width:2px;background:var(--border)}.trace>div:last-child:before{display:none}
.trace .tn{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);display:grid;place-items:center;flex:none;z-index:1}.trace .tn.bad{background:var(--danger-soft);color:var(--danger)}.trace .tn .i{width:12px;height:12px;stroke-width:3}
.score-bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.kpi-tile{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface)}
.kpi-tile .v{font-size:22px;font-weight:600}.kpi-tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.report-doc{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px 36px;line-height:1.65}
.report-doc h3{font-size:20px;margin-bottom:4px}.report-doc h4{font-size:15px;margin:20px 0 6px;color:var(--primary-d)}
.report-doc table{width:100%;border-collapse:collapse;margin:8px 0}.report-doc th,.report-doc td{padding:8px 10px;border:1px solid var(--border);text-align:left}.report-doc th{background:var(--surface-2)}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}.flow .n{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:3px 9px}.flow i{color:var(--faint);font-style:normal}
.mod-tile{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:96px;transition:border-color .15s,box-shadow .15s}
.mod-tile:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.mod-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-d)}
.sw{position:relative;width:40px;height:24px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--border-strong);border-radius:99px;transition:.2s}.sw i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--primary)}.sw input:checked+i:before{transform:translateX(16px)}.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g31,.g13{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:272px;box-shadow:var(--shadow-md)}.side.open{transform:none}
  .menu-btn{display:inline-grid}.top{padding:10px 14px}#view{padding:16px 14px 48px}.search{display:none}
  .g2,.g3{grid-template-columns:1fr}.hide-m{display:none}.report-doc{padding:20px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.top h1{font-size:16px}}
@media (pointer:coarse){.btn,.icon-btn,.nav-i,input,select{min-height:44px}.icon-btn{width:44px}.btn.sm{min-height:40px}.tabs button{min-height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.top,.page-h .btn,#toasts{display:none!important}.app{display:block}#view{padding:0}}

</style>
</head>

<script>
'use strict';
/* ============ CORE ============ */
const KEY='northstar_agency_os_demo_v1';
const MIN=60000,HR=3600000,DAY=86400000;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const iso=ms=>new Date(ms).toISOString();
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const round2=n=>Math.round(n*100)/100;
const icon=(n,c='')=>`<svg class="i ${c}" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const inrC=n=>{n=Number(n)||0;const a=Math.abs(n);return a>=1e7?'₹'+round2(n/1e7)+' Cr':a>=1e5?'₹'+round2(n/1e5)+' L':a>=1e3?'₹'+round2(n/1e3)+' K':'₹'+Math.round(n);};
const pct=n=>round2(n)+'%';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
const fmtDT=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit',hour12:true});};
const fmtMonth=m=>{const [y,mo]=String(m).split('-');return MONTHS[+mo-1]+' '+y;};
const shortMonth=m=>MONTHS[+String(m).split('-')[1]-1].slice(0,3);
const monthKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1);};
function rel(v){const t=typeof v==='number'?v:Date.parse(v);if(isNaN(t))return '—';const diff=t-Date.now(),a=Math.abs(diff),f=diff>0;let s;if(a<45e3)return f?'in a moment':'just now';if(a<HR)s=Math.round(a/MIN)+'m';else if(a<DAY)s=Math.round(a/HR)+'h';else s=Math.round(a/DAY)+'d';return f?'in '+s:s+' ago';}
const initials=n=>{const w=String(n||'?').trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase();};
const AVC=['#2563EB','#0D9488','#B45309','#6D28D9','#BE123C','#0369A1','#4D7C0F','#475569'];
function avatar(name,cls=''){let h=0;for(const ch of String(name||'?'))h=(h*31+ch.charCodeAt(0))>>>0;return `<div class="av ${cls}" style="background:${AVC[h%AVC.length]}" aria-hidden="true">${esc(initials(name))}</div>`;}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let DB=null;
const UI={tab:'dashboard',cliQ:'',cliStatus:'',cliPkg:'',onbClient:'',cntClient:'',cntFilter:'all',cntDraft:null,apFilter:'',leadQ:'',leadTier:'',leadStatus:'',leadView:'table',leadSort:'score',leadDir:-1,camSel:'',camQ:'',repClient:'',repSel:'',consoleMod:'onboard',consoleApply:true,consoleOut:null};
/* ---- toast / modal (focus managed) ---- */
function toast(msg,type=''){
  const el=document.createElement('div');el.className='toast '+type;if(type==='err')el.setAttribute('role','alert');
  el.innerHTML=icon(type==='err'?'alert':type==='ok'?'check':'info','sm')+`<span>${esc(msg)}</span>`;
  const tb=$('#toasts');while(tb.children.length>=3)tb.firstChild.remove();tb.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},4000);
}
let MODAL=null,_opener=null;
function openModal({title,body,actions=[],wide=false,drawer=false,onMount}){
  closeModal(true);_opener=document.activeElement;
  const root=$('#modalRoot');
  root.innerHTML=`<div class="ov ${drawer?'drawer':''}" data-ov><div class="md ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mdTitle"><div class="mh"><span id="mdTitle">${title}</span><span class="sp"></span><button class="icon-btn flat" data-act="closeModal" aria-label="Close dialog">${icon('x')}</button></div><div class="mb" id="mdBody">${body}</div>${actions.length?`<div class="mf">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-mact="${i}">${a.label}</button>`).join('')}</div>`:''}</div></div>`;
  MODAL={actions};document.body.style.overflow='hidden';
  if(onMount)onMount($('#mdBody'));
  const f=$('#mdBody input:not([type=hidden]),#mdBody select,#mdBody textarea')||$('.md .icon-btn');if(f&&!(f.matches&&f.matches('textarea')&&drawer))f.focus({preventScroll:true});
}
function closeModal(silent){
  $('#modalRoot').innerHTML='';MODAL=null;document.body.style.overflow='';
  if(!silent&&_opener&&document.contains(_opener))try{_opener.focus({preventScroll:true});}catch(e){}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&MODAL){const f=$$('.md button:not([disabled]),.md input:not([type=hidden]):not([disabled]),.md select,.md textarea,.md a[href],.md summary,.md [tabindex="0"]').filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
});
const formData=root=>{const o={};$$('[name]',root||$('#mdBody')).forEach(el=>{if(el.type==='radio'&&!el.checked)return;o[el.name]=el.type==='checkbox'?el.checked:el.value;});return o;};
function confirmBox(msg,onYes,label='Delete'){openModal({title:'Please confirm',body:`<p style="margin:0">${msg}</p>`,actions:[{label:'Cancel',onClick:closeModal},{label:label,cls:'dng',onClick:()=>{closeModal();onYes();}}]});}
function showErr(el,msg){el.setAttribute('aria-invalid','true');let e=el.parentElement.querySelector('.err');if(!e){e=document.createElement('span');e.className='err';e.setAttribute('role','alert');el.parentElement.appendChild(e);}e.textContent=msg;el.focus();el.addEventListener('input',()=>{el.removeAttribute('aria-invalid');if(e)e.remove();},{once:true});}
/* ---- persistence ---- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.clients&&d.agency){DB=d;return;}}}catch(e){}DB=seedData();}
let _rt=null;
function touch(){save();clearTimeout(_rt);_rt=setTimeout(()=>{try{refresh();}catch(e){console.error(e);}},50);}
function logEvent(kind,text){DB.events.unshift({id:uid('e'),kind,text,at:iso(Date.now())});if(DB.events.length>80)DB.events.length=80;}
/* ---- downloads ---- */
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvDownload=(name,rows)=>download(name,rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n'),'text/csv');
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard','ok');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard','ok');}catch(x){toast('Copy is not available in this browser','err');}ta.remove();}}
/* ---- charts (accessible SVG) ---- */
function niceMax(m){if(m<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(m)));const c=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=m);return c;}
function barChart({labels,series,colors,names,H=220,W=640,fmt=v=>v,label}){
  const pl=48,pb=28,pt=12,max=niceMax(Math.max(1,...series.flat())),gw=(W-pl)/labels.length,bw=Math.min(26,gw/(series.length+.8)),ih=H-pb-pt;
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E2E8F0"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#475569">${fmt(max*i/4)}</text>`;}
  let bars='';labels.forEach((l,i)=>{const cx=pl+gw*i+gw/2,tot=bw*series.length+4*(series.length-1);series.forEach((s,j)=>{const h=ih*s[i]/max,x=cx-tot/2+j*(bw+4);bars+=`<rect x="${x}" y="${pt+ih-h}" width="${bw}" height="${Math.max(h,s[i]?2:0)}" rx="3" fill="${colors[j]}"><title>${esc(l)} · ${esc(names[j])}: ${fmt(s[i])}</title></rect>`;});bars+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="12" fill="#475569">${esc(l)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">${g}${bars}</svg><div class="legend">${names.map((n,j)=>`<span><i style="background:${colors[j]}"></i>${esc(n)}</span>`).join('')}</div>`;
}
function lineChart({labels,series,colors,names,H=220,W=640,fmt=v=>v,label}){
  const pl=48,pb=28,pt=12,max=niceMax(Math.max(1,...series.flat())),ih=H-pb-pt,step=(W-pl-14)/Math.max(1,labels.length-1);
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E2E8F0"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#475569">${fmt(max*i/4)}</text>`;}
  let out='';series.forEach((s,j)=>{const pts=s.map((v,i)=>[pl+step*i+6,pt+ih-ih*v/max]);out+=`<path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="${colors[j]}" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="${colors[j]}" stroke-width="2"><title>${esc(labels[i])} · ${esc(names[j])}: ${fmt(s[i])}</title></circle>`).join('');});
  const xl=labels.map((l,i)=>labels.length>8&&i%2?'':`<text x="${pl+step*i+6}" y="${H-9}" text-anchor="middle" font-size="12" fill="#475569">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">${g}${out}${xl}</svg><div class="legend">${names.map((n,j)=>`<span><i style="background:${colors[j]}"></i>${esc(n)}</span>`).join('')}</div>`;
}
function donut(items,center,label){
  const total=sum(items,i=>i.v),r=52,C2=2*Math.PI*r;let off=0,arcs='';
  if(!total)arcs=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="#E2E8F0" stroke-width="16"/>`;
  items.forEach(i=>{if(!i.v)return;const len=C2*i.v/total;arcs+=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${i.color}" stroke-width="16" stroke-dasharray="${len} ${C2-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(i.l)}: ${i.v}</title></circle>`;off+=len;});
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}">${arcs}<text x="70" y="70" text-anchor="middle" font-size="24" font-weight="600" fill="#0F172A">${total}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="#475569">${esc(center)}</text></svg>`;

  const camps=DB.campaigns.filter(x=>x.clientId===c.id),cont=DB.content.filter(x=>x.clientId===c.id),reps=DB.reports.filter(x=>x.clientId===c.id),tabs=[['overview','Overview'],['onboarding','Onboarding'],['campaigns','Campaigns ('+camps.length+')'],['content','Content ('+cont.length+')'],['reports','Reports ('+reps.length+')']];
  const head=`<div class="row" style="margin-bottom:12px">${avatar(c.name,'lg')}<div class="sp"><div class="b" style="font-size:16px">${esc(c.name)}</div><div class="xs muted">${esc(c.industry||'—')} · ${esc(c.city)} · since ${fmtDate(c.startDate)}</div></div>${clientBadge(c.status)}</div><div class="tabs" role="tablist" aria-label="Client sections" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${_cdTab===k}" data-act="cdTab" data-t="${k}">${l}</button>`).join('')}</div>`;
  let b='';
  if(_cdTab==='overview'){const m=c.monthly.slice(-6);b=`<dl style="display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0 0 16px" class="sm"><dt class="muted">Package</dt><dd style="margin:0">${esc(c.package)} (${inr((PACKAGES[c.package]||{fee:0}).fee)}/month)</dd><dt class="muted">Ad budget</dt><dd style="margin:0">${inr(c.monthlyBudget)}/month</dd><dt class="muted">Goals</dt><dd style="margin:0">${esc(c.goals)}</dd><dt class="muted">Owner</dt><dd style="margin:0">${esc(ownerName(c))}</dd><dt class="muted">Contact</dt><dd style="margin:0">${esc(c.contact||'—')}${c.email?` · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''}${c.phone?' · '+esc(c.phone):''}</dd><dt class="muted">Channels</dt><dd style="margin:0">${c.channels.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</dd><dt class="muted">Health</dt><dd style="margin:0"><b>${c.health}</b>/100</dd>${c.notes?`<dt class="muted">Notes</dt><dd style="margin:0">${esc(c.notes)}</dd>`:''}</dl>${m.length?`<div class="b" style="margin-bottom:6px">Performance</div>${barChart({labels:m.map(x=>shortMonth(x.m)),series:[m.map(x=>x.spend),m.map(x=>x.revenue)],colors:['#64748B','#2563EB'],names:['Spend','Revenue'],H:200,W:520,fmt:v=>inrC(v),label:'Spend and revenue by month for '+c.name})}`:'<div class="notice info">No performance history yet.</div>'}`;}
  if(_cdTab==='onboarding')b=c.plan?`<div class="row" style="margin-bottom:10px"><div class="progress sp"><i style="width:${planProgress(c)}%"></i></div><b>${planProgress(c)}%</b></div><p class="sm muted">${c.plan.kickoff.filter(x=>x.done).length}/${c.plan.kickoff.length} kickoff tasks · ${c.plan.access.filter(x=>x.state==='Received').length}/${c.plan.access.length} access items received</p><button class="btn" data-act="openOnb" data-id="${c.id}">Open onboarding workspace</button>`:`<div class="empty">No plan yet.</div>`;
  if(_cdTab==='campaigns')b=camps.map(x=>{const k=campaignKpis(x);return `<div class="list-i" style="cursor:pointer" data-act="openCampaign" data-id="${x.id}" role="button" tabindex="0"><div class="sp"><b class="sm">${esc(x.name)}</b><div class="xs muted">${x.channel} · spend ${inr(x.spend)}</div></div>${campBadge(x.status)}<b>${k.ROAS}x</b></div>`;}).join('')||'<div class="empty">No campaigns</div>';
  if(_cdTab==='content')b=cont.map(x=>`<div class="list-i"><span style="color:var(--primary-d)">${icon(platIcon(x.platform))}</span><div class="sp"><b class="sm">${esc(x.title)}</b><div class="xs muted">${x.platform} · ${rel(x.createdAt)}</div></div>${contentBadge(x.status)}</div>`).join('')||'<div class="empty">No content</div>';
  if(_cdTab==='reports')b=reps.map(x=>`<div class="list-i" style="cursor:pointer" data-act="openReport" data-id="${x.id}" role="button" tabindex="0">${icon('file')}<div class="sp"><b class="sm">${fmtMonth(x.month)}</b><div class="xs muted">${x.leadsGenerated} leads · ROAS ${x.spend?round2(x.revenue/x.spend):0}x</div></div>${bd(x.status,x.status==='Sent'?'b-ok':'b-warn')}</div>`).join('')||'<div class="empty">No reports</div>';
  openModal({title:'Client profile',drawer:true,body:head+`<div role="tabpanel">${b}</div>`,actions:[{label:'Delete',cls:'dng',onClick:()=>confirmBox(`Delete <b>${esc(c.name)}</b> and their campaigns, content and reports?`,()=>{DB.clients=DB.clients.filter(x=>x.id!==c.id);['campaigns','content','reports'].forEach(k=>{DB[k]=DB[k].filter(x=>x.clientId!==c.id);});closeModal();touch();toast('Client deleted');})},{label:'Edit',onClick:()=>editClient(c)},{label:'Close',cls:'pri',onClick:closeModal}]});
}
ACT.cdTab=el=>{_cdTab=el.dataset.t;const sc=$('#mdBody').scrollTop;drawClient();const t=$('[role=tab][aria-selected=true]');if(t)t.focus();};
function editClient(c){
  openModal({title:'Edit client',wide:true,body:clientForm(c)+`<div class="grid g2" style="margin-top:12px"><label class="fld">Status<select name="status">${CLIENT_STATUS.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="fld">Health score (0-100)<input name="health" type="number" min="0" max="100" value="${c.health}"></label></div><label class="fld" style="margin-top:12px">Notes<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>`,actions:[{label:'Cancel',onClick:()=>drawClient()},{label:'Save changes',cls:'pri',onClick:()=>{const f=formData();if(!f.name.trim())return showErr($('[name=name]'),'Enter the client name');if(!(+f.monthlyBudget>=0))return showErr($('[name=monthlyBudget]'),'Enter a valid budget');
    if(f.status==='Paused'&&c.status!=='Paused')c.pausedFrom=monthKey(Date.now());if(f.status!=='Paused')c.pausedFrom='';
    Object.assign(c,{name:f.name.trim(),industry:f.industry,package:f.package,monthlyBudget:+f.monthlyBudget,city:f.city,startDate:f.startDate,owner:f.owner,contact:f.contact,email:f.email,goals:f.goals,status:f.status,health:Math.max(0,Math.min(100,+f.health||0)),notes:f.notes});touch();drawClient();toast('Client saved','ok');}}]});
}

/* ============ ONBOARDING ============ */
function onbClient(){let c=clientById(UI.onbClient);if(!c){c=DB.clients.find(x=>x.status==='Onboarding')||DB.clients[0];UI.onbClient=c?c.id:'';}return c;}
function onbBody(c){
  const p=c.plan;if(!p)return `<div class="card"><div class="empty">No plan yet. <button class="btn pri" data-act="onbGen">Generate plan</button></div></div>`;
  const wk=w=>Math.round(100*w.tasks.filter(t=>t.done).length/w.tasks.length);
  return `<div class="grid g31" style="align-items:start"><div class="col">
   <div class="card"><div class="hd">1. Kickoff checklist <span class="sub" id="kickCnt">${p.kickoff.filter(x=>x.done).length}/${p.kickoff.length}</span></div><div class="bd">${p.kickoff.map(x=>`<label class="chk" style="padding:5px 0"><input type="checkbox" data-ch="onbTask" data-k="kick" data-id="${x.id}" ${x.done?'checked':''}><span>${esc(x.text)}</span></label>`).join('')}</div></div>
   <div class="card"><div class="hd">3. 30-day action plan</div><div class="bd"><div class="accordion">${p.weeks.map(w=>`<details ${w.week===1?'open':''}><summary><span class="badge b-info nodot">Week ${w.week}</span>${esc(w.title)}<span class="sp"></span><span class="xs muted" id="wk${w.week}">${wk(w)}%</span></summary><div class="ab">${w.tasks.map(t=>`<label class="chk" style="padding:4px 0"><input type="checkbox" data-ch="onbTask" data-k="week" data-id="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span></label>`).join('')}</div></details>`).join('')}</div></div></div></div>
   <div class="card"><div class="hd">2. Access &amp; assets <span class="sub" id="accCnt">${p.access.filter(x=>x.state==='Received').length}/${p.access.length} received</span></div><div class="bd">${p.access.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="sm" style="margin-bottom:6px">${esc(a.text)} ${a.priority==='Required'?bd('Required','b-warn'):bd('Helpful')}</div><label class="sr-only" for="ac_${a.id}">Status for ${esc(a.text)}</label><select id="ac_${a.id}" data-ch="onbAccess" data-id="${a.id}" style="min-height:32px;padding:4px 8px">${['Pending','Requested','Received'].map(s=>`<option ${a.state===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}<button class="btn sm" style="margin-top:12px" data-act="onbRemind">${icon('mail','sm')} Send reminder for pending items</button></div></div></div>`;
}
VIEWS.onboarding={render(){
  const c=onbClient(),onb=DB.clients.filter(x=>x.status==='Onboarding');if(!c)return '<div class="empty">No clients yet.</div>';
  return `<div class="page-h"><h2>Client onboarding</h2><span class="desc">${onb.length} client${onb.length===1?'':'s'} onboarding</span><span class="sp"></span><label class="sr-only" for="onbSel">Choose client</label><select id="onbSel" style="width:auto;min-width:220px" data-ch="onbSel">${DB.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)} (${x.status})</option>`).join('')}</select><button class="btn" data-act="onbGen">${icon('refresh','sm')} Regenerate plan</button><button class="btn" data-act="onbCopy">${icon('copy','sm')} Copy plan</button>${c.status==='Onboarding'?`<button class="btn ok" data-act="onbDone">${icon('check','sm')} Mark onboarding complete</button>`:''}</div>
  <div class="card" style="margin-bottom:16px"><div class="bd row wrap" style="gap:20px">${avatar(c.name,'lg')}<div style="min-width:220px"><div class="b" style="font-size:16px">${esc(c.name)} ${clientBadge(c.status)}</div><div class="sm muted">${esc(c.package)} · ${inr(c.monthlyBudget)}/month ad budget · owner ${esc(ownerName(c))}</div><div class="sm" style="margin-top:4px"><b>Goal:</b> ${esc(c.goals)}</div></div><div class="sp" style="min-width:220px"><div class="row"><span class="sm b">Overall progress</span><span class="sp"></span><b id="onbPct">${planProgress(c)}%</b></div><div class="progress" style="margin-top:6px"><i id="onbBar" style="width:${planProgress(c)}%"></i></div></div></div></div>
  <div id="onbBody">${onbBody(c)}</div>`;
},update(){}};
INP.onbSel=el=>{UI.onbClient=el.value;render();};
function onbRefresh(c){const p=c.plan;$('#onbPct').textContent=planProgress(c)+'%';$('#onbBar').style.width=planProgress(c)+'%';$('#kickCnt').textContent=p.kickoff.filter(x=>x.done).length+'/'+p.kickoff.length;$('#accCnt').textContent=p.access.filter(x=>x.state==='Received').length+'/'+p.access.length+' received';p.weeks.forEach(w=>{const e=$('#wk'+w.week);if(e)e.textContent=Math.round(100*w.tasks.filter(t=>t.done).length/w.tasks.length)+'%';});save();$('#nav').innerHTML=navHTML();}
INP.onbTask=el=>{const c=onbClient(),list=el.dataset.k==='kick'?c.plan.kickoff:c.plan.weeks.flatMap(w=>w.tasks),t=list.find(x=>x.id===el.dataset.id);t.done=el.checked;onbRefresh(c);};
INP.onbAccess=el=>{const c=onbClient(),a=c.plan.access.find(x=>x.id===el.dataset.id);a.state=el.value;onbRefresh(c);};
ACT.onbRemind=()=>{const c=onbClient(),n=c.plan.access.filter(a=>a.state==='Pending').length;if(!n){toast('Nothing pending - all items requested or received');return;}c.plan.access.forEach(a=>{if(a.state==='Pending')a.state='Requested';});save();render();toast(`Reminder sent to ${c.contact||'the client'} for ${n} item${n>1?'s':''}`,'ok');};
ACT.onbGen=()=>{const c=onbClient();if(c.plan&&planProgress(c)>0){confirmBox('Regenerating replaces the current plan and clears progress.',()=>{c.plan=genOnboardingPlan(c);logEvent('onboard',`Onboarding plan regenerated for ${c.name}`);touch();render();toast('Plan regenerated','ok');},'Regenerate');return;}c.plan=genOnboardingPlan(c);logEvent('onboard',`Onboarding plan generated for ${c.name}`);touch();render();toast('Plan generated','ok');};
ACT.onbCopy=()=>{const c=onbClient();if(c.plan)copyText(planToText(c,c.plan));};
ACT.onbDone=()=>{const c=onbClient();const p=planProgress(c);const go2=()=>{c.status='Active';logEvent('onboard',`${c.name} completed onboarding`);touch();render();toast(`${c.name} is now Active`,'ok');};if(p<100)confirmBox(`Onboarding is only ${p}% complete. Mark ${esc(c.name)} as Active anyway?`,go2,'Mark Active');else go2();};

function postPreview(p,platform,brand){return `<div class="post-prev"><div class="ph">${avatar(brand,'sm')}<div class="sp"><b class="sm">${esc(brand)}</b><div class="xs muted">${platform} · sponsored-style preview</div></div></div><div class="pi" aria-hidden="true">${icon('image','lg')}</div><div class="pb"><div>${esc(p.caption)}</div><div style="margin-top:8px;color:var(--primary-d)">${p.hashtags.map(esc).join(' ')}</div><div style="margin-top:8px"><b>${esc(p.cta)}</b></div></div></div>`;}
function cntResults(){
  const d=UI.cntDraft;if(!d)return `<div class="card"><div class="empty">${icon('sparkles','lg')}<br>Fill in the brief and generate posts. You will get a caption, 5-8 hashtags and a CTA for each.</div></div>`;
  const cl=clientById(d.brief.clientId);
  return `<div class="row wrap" style="margin-bottom:12px"><div class="tabs" role="tablist" aria-label="Result view"><button role="tab" aria-selected="${d.view==='cards'}" data-act="cntView" data-v="cards">Post cards</button><button role="tab" aria-selected="${d.view==='json'}" data-act="cntView" data-v="json">Structured JSON</button></div><span class="sp"></span><button class="btn" data-act="cntRegen">${icon('refresh','sm')} Regenerate</button><button class="btn" data-act="cntSave" data-st="Draft">Save as drafts</button><button class="btn pri" data-act="cntSave" data-st="In review">${icon('send','sm')} Send all to approval</button></div>
  ${d.view==='json'?`<pre class="json">${esc(JSON.stringify({posts:d.posts},null,2))}</pre>`:`<div class="grid g2">${d.posts.map((p,i)=>`<div class="col"><div>${postPreview(p,d.brief.platform,cl?cl.name:'Brand')}</div><div class="card"><div class="bd col" style="gap:10px"><label class="fld">Caption<textarea data-in="cntEdit" data-i="${i}" data-k="caption" rows="4">${esc(p.caption)}</textarea></label><label class="fld">Hashtags<input type="text" data-in="cntEdit" data-i="${i}" data-k="hashtags" value="${esc(p.hashtags.join(' '))}"><span class="hint" id="ht${i}">${p.hashtags.length} hashtags (aim for 5-8)</span></label><label class="fld">Call to action<input type="text" data-in="cntEdit" data-i="${i}" data-k="cta" value="${esc(p.cta)}"></label></div></div></div>`).join('')}</div>`}`;

function openContentDrawer(id){
  const it=DB.content.find(x=>x.id===id);if(!it)return;const cl=clientById(it.clientId)||{name:'Unassigned'};
  const acts=[{label:'Delete',cls:'dng',onClick:()=>confirmBox('Delete this post?',()=>{DB.content=DB.content.filter(x=>x.id!==it.id);closeModal();touch();})}];
  acts.push({label:'Save edits',onClick:()=>{const f=formData();it.caption=f.caption;it.hashtags=f.hashtags.split(/[\s,]+/).filter(Boolean).map(t=>t.startsWith('#')?t:'#'+t);it.cta=f.cta;it.scheduledFor=f.scheduledFor?new Date(f.scheduledFor).toISOString():'';hist(it,'You','Edited');closeModal();touch();toast('Saved','ok');}});
  if(it.status==='Draft'||it.status==='Revision')acts.push({label:'Submit for approval',cls:'pri',onClick:()=>{it.status='In review';hist(it,'Meera Nair','Submitted for approval');logEvent('approval',`${it.title} (${it.platform}) submitted for approval`);closeModal();touch();toast('Submitted for approval','ok');}});
  if(it.status==='In review')acts.push({label:'Approve',cls:'ok',onClick:()=>{approvalGate(it,true);closeModal();touch();toast('Approved - queued for publishing','ok');}});
  if(it.status==='Queued')acts.push({label:'Mark as published',cls:'pri',onClick:()=>{it.status='Published';hist(it,'System','Published');closeModal();touch();toast('Marked as published','ok');}});

   <div class="row wrap"><button class="btn pri" data-act="conSend">${icon('send','sm')} Send request</button><button class="btn" data-act="conCurl">${icon('copy','sm')} Copy cURL</button></div></div></div>
   <div class="card"><div class="hd">Response</div><div class="bd" id="conOut">${conOut()}</div></div></div>
  <div class="card" style="margin-bottom:20px"><div class="hd">Modules <span class="sub">Route Module switch, six branches plus a fallback</span></div><div class="bd grid g3">${MODULES.map(m=>`<div class="kpi-tile"><div class="row" style="margin-bottom:6px"><span class="mod-ic" style="width:30px;height:30px;background:${MODCOLOR[m.key]}1A;color:${MODCOLOR[m.key]}">${icon(m.icon,'sm')}</span><b class="sp">${m.name}</b><span class="mono muted">${m.key}</span></div><div class="xs muted" style="margin-bottom:8px">${m.desc}</div><div class="flow">${m.flow.slice(2).map((n,i,a)=>`<span class="n">${esc(n)}</span>${i<a.length-1?'<i>→</i>':''}`).join('')}</div></div>`).join('')}</div></div>
  <div class="card"><div class="hd">Run history</div><div id="conHist">${conHist()}</div></div>`;
},update(){const h=$('#conHist');if(h)h.innerHTML=conHist();}};
INP.conMod=el=>{UI.consoleMod=el.value;$('#conBody').value=JSON.stringify(SAMPLES[el.value],null,2);};
INP.conApply=el=>{UI.consoleApply=el.checked;};
ACT.conSend=async()=>{
  let body;try{body=JSON.parse($('#conBody').value||'{}');}catch(e){return showErr($('#conBody'),'Invalid JSON: '+e.message);}
  const btn=$('[data-act=conSend]');btn.disabled=true;const t=performance.now();await sleep(350);
  const r=agencyOsCall(body,{apply:UI.consoleApply}),ms=Math.round(performance.now()-t)+rnd(200,700);
  recordRun(body,r,ms);UI.consoleOut={body,r,ms};btn.disabled=false;touch();$('#conOut').innerHTML=conOut();VIEWS.console.update();
  toast(r.status===200?`Module "${body.module}" completed`:'400 - Unknown module',r.status===200?'ok':'err');
};
ACT.conLoad=el=>{const r=DB.runs.find(x=>x.id===el.dataset.id);UI.consoleOut={body:r.request,r:{status:r.status,json:r.response,trace:r.trace,applied:r.applied},ms:r.ms};$('#conOut').innerHTML=conOut();$('#conBody').value=JSON.stringify(r.request,null,2);window.scrollTo({top:0,behavior:'smooth'});};
ACT.conCopyResp=()=>copyText($('#conJson').textContent);
ACT.conCurl=()=>{let b;try{b=JSON.stringify(JSON.parse($('#conBody').value||'{}'));}catch(e){b=$('#conBody').value.replace(/\s+/g,' ');}copyText(`curl -X POST '${DB.agency.webhook}' -H 'Content-Type: application/json' -d '${b.replace(/'/g,"'\\''")}'`);};

/* ============ SETTINGS ============ */
const DEF_SCORING={email:40,domain:30,employees:20,employeesMin:5,city:10,cityName:'Bhopal',hot:70,warm:40};
VIEWS.settings={update(){},render(){
  const a=DB.agency,s=a.scoring;
  return `<div class="page-h"><h2>Settings</h2><span class="desc">Agency profile, lead scoring rules, team and data</span></div>
  <div class="grid g2" style="align-items:start"><div class="col">
   <div class="card" id="sec-agency"><div class="hd">Agency profile</div><div class="bd col"><div class="grid g2"><label class="fld">Agency name<input name="name" type="text" value="${esc(a.name)}"></label><label class="fld">Home city<input name="city" type="text" value="${esc(a.city)}"></label></div>
    <label class="fld">Webhook URL<div class="row"><input name="webhook" type="url" value="${esc(a.webhook)}"><button class="icon-btn" data-act="setCopyHook" aria-label="Copy webhook URL">${icon('copy','sm')}</button></div></label>
    <div class="grid g2"><label class="fld">AI model label<input name="model" type="text" value="${esc(a.model)}"><span class="hint">Display only: outputs are simulated</span></label><label class="fld">Approval SLA (hours)<input name="approvalSLA" type="number" min="1" value="${a.approvalSLA}"></label></div>
    <div><button class="btn pri" data-act="setSave" data-sec="agency">Save profile</button></div></div></div>
   <div class="card" id="sec-scoring"><div class="hd">Lead scoring rules <span class="sub">Enrich &amp; Score Leads node</span></div><div class="bd col"><div class="grid g2"><label class="fld">Points: has email<input name="email" type="number" min="0" max="100" value="${s.email}"></label><label class="fld">Points: has website domain<input name="domain" type="number" min="0" max="100" value="${s.domain}"></label><label class="fld">Points: team size reached<input name="employees" type="number" min="0" max="100" value="${s.employees}"></label><label class="fld">Minimum team size<input name="employeesMin" type="number" min="1" value="${s.employeesMin}"></label><label class="fld">Points: home city<input name="city" type="number" min="0" max="100" value="${s.city}"></label><label class="fld">Home city name<input name="cityName" type="text" value="${esc(s.cityName)}"></label><label class="fld">Hot tier from score<input name="hot" type="number" min="1" max="100" value="${s.hot}"></label><label class="fld">Warm tier from score<input name="warm" type="number" min="1" max="100" value="${s.warm}"></label></div>
    <div class="row wrap"><button class="btn pri" data-act="setSave" data-sec="scoring">Save and re-score all leads</button><button class="btn" data-act="setScoreReset">Reset to workflow defaults</button></div></div></div>
  </div><div class="col">
   <div class="card"><div class="hd">Team</div><div class="bd">${DB.team.map(t=>`<div class="list-i">${avatar(t.name)}<div class="sp"><b class="sm">${esc(t.name)}</b><div class="xs muted">${esc(t.role)} · ${esc(t.email)}</div></div><span class="chip">${DB.clients.filter(c=>c.owner===t.id).length} clients</span></div>`).join('')}<button class="btn sm" style="margin-top:10px" data-act="teamAdd">${icon('plus','sm')} Add team member</button></div></div>
   <div class="card"><div class="hd">Data</div><div class="bd col"><div class="sm muted">All data lives in this browser. Export a backup, import one, or start over.</div><div class="row wrap"><button class="btn" data-act="dbExport">${icon('download','sm')} Export JSON</button><button class="btn" data-act="dbImport">${icon('upload','sm')} Import JSON</button><input type="file" id="importFile" accept="application/json" class="hide" data-ch="importFile" aria-label="Import backup file"></div><div class="row wrap"><button class="btn dng" data-act="dbReset">${icon('refresh','sm')} Reset demo data</button><button class="btn dng" data-act="dbClear">${icon('trash','sm')} Clear all records</button></div></div></div>
  </div></div>`;
}};
ACT.setCopyHook=()=>copyText(DB.agency.webhook);
ACT.setSave=el=>{const sec=el.dataset.sec,f=formData($('#sec-'+sec)),a=DB.agency;
  if(sec==='agency'){if(!f.name.trim())return showErr($('#sec-agency [name=name]'),'Enter the agency name');Object.assign(a,{name:f.name.trim(),city:f.city,webhook:f.webhook.trim(),model:f.model,approvalSLA:Math.max(1,+f.approvalSLA||48)});toast('Profile saved','ok');}
  if(sec==='scoring'){const n=k=>+f[k]||0;if(n('warm')>=n('hot'))return showErr($('#sec-scoring [name=warm]'),'Warm threshold must be lower than the Hot threshold');a.scoring={email:n('email'),domain:n('domain'),employees:n('employees'),employeesMin:Math.max(1,n('employeesMin')),city:n('city'),cityName:f.cityName.trim()||'Bhopal',hot:n('hot'),warm:n('warm')};rescoreAll();toast('Scoring saved and all leads re-scored','ok');}
  touch();};
ACT.setScoreReset=()=>{DB.agency.scoring={...DEF_SCORING};rescoreAll();touch();render();toast('Scoring reset to the workflow defaults','ok');};
ACT.teamAdd=()=>openModal({title:'Add team member',body:`<div class="col"><label class="fld">Name<input name="name" type="text"></label><label class="fld">Role<input name="role" type="text" placeholder="Designer"></label><label class="fld">E-mail<input name="email" type="email"></label></div>`,actions:[{label:'Cancel',onClick:closeModal},{label:'Add',cls:'pri',onClick:()=>{const f=formData();if(!f.name.trim())return showErr($('[name=name]'),'Enter a name');DB.team.push({id:uid('t'),name:f.name.trim(),role:f.role||'Team member',email:f.email});closeModal();touch();render();toast('Team member added','ok');}}]});
ACT.dbExport=()=>{download('northstar-agency-os-backup.json',JSON.stringify(DB,null,2),'application/json');toast('Backup downloaded','ok');};
ACT.dbImport=()=>$('#importFile').click();
INP.importFile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.clients||!d.agency||!d.campaigns)throw new Error('Not an Agency OS backup');DB=d;save();render();toast('Backup imported','ok');}catch(e){toast('Import failed: '+e.message,'err');}};r.readAsText(f);};
ACT.dbReset=()=>confirmBox('Reset to the original demo data? Your changes will be lost.',()=>{DB=seedData();UI.cntDraft=null;UI.repDraft=null;UI.consoleOut=null;save();render();toast('Demo data restored','ok');},'Reset');
ACT.dbClear=()=>confirmBox('Delete all clients, campaigns, content, leads and reports? Settings and team stay.',()=>{Object.assign(DB,{clients:[],campaigns:[],content:[],leads:[],reports:[],runs:[],events:[]});UI.cntDraft=null;UI.repDraft=null;save();render();toast('All records cleared');},'Clear all');

/* ============ BOOT ============ */
(function boot(){
  load();
  ['clients','campaigns','content','leads','reports','runs','events','team'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  UI.cntFilter='all';UI.camClient='';UI.camStatus='';
  const h=location.hash.slice(1);UI.tab=VIEWS[h]?h:'dashboard';
  render();
  window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VIEWS[t]&&t!==UI.tab){UI.tab=t;render();}});
  window.__crm={get db(){return DB;},ui:UI,go};
})();

</script>
</body>
</html>
